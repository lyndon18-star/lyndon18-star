<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Lyndon's custom mascot: Code Cat with circuit tail -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Glow background -->
  <circle cx="100" cy="100" r="90" fill="url(#glowGrad)" filter="url(#shadow)"/>

  <!-- Body (rounded square with circuit pattern) -->
  <rect x="30" y="40" width="140" height="130" rx="35" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Circuit pattern on body -->
  <g stroke="#0B1220" stroke-width="1.5" opacity="0.3">
    <path d="M50 80 L150 80"/>
    <path d="M50 110 L150 110"/>
    <path d="M80 60 L80 150"/>
    <path d="M120 60 L120 150"/>
    <circle cx="80" cy="80" r="6"/>
    <circle cx="120" cy="110" r="6"/>
  </g>

  <!-- Ears -->
  <path d="M50 45 L65 15 L80 45" fill="url(#bodyGrad)" stroke="#38BDF8" stroke-width="2"/>
  <path d="M120 45 L135 15 L150 45" fill="url(#bodyGrad)" stroke="#38BDF8" stroke-width="2"/>

  <!-- Ear inner -->
  <path d="M55 40 L65 20 L75 40" fill="#0B1220" opacity="0.5"/>
  <path d="M125 40 L135 20 L145 40" fill="#0B1220" opacity="0.5"/>

  <!-- Eyes -->
  <g>
    <!-- Left eye -->
    <ellipse cx="75" cy="95" rx="18" ry="22" fill="#0B1220"/>
    <ellipse cx="75" cy="95" rx="10" ry="14" fill="url(#eyeGrad)"/>
    <circle cx="72" cy="90" r="4" fill="white" opacity="0.9"/>
    <circle cx="77" cy="98" r="2" fill="white" opacity="0.5"/>

    <!-- Right eye -->
    <ellipse cx="125" cy="95" rx="18" ry="22" fill="#0B1220"/>
    <ellipse cx="125" cy="95" rx="10" ry="14" fill="url(#eyeGrad)"/>
    <circle cx="122" cy="90" r="4" fill="white" opacity="0.9"/>
    <circle cx="127" cy="98" r="2" fill="white" opacity="0.5"/>
  </g>

  <!-- Nose -->
  <ellipse cx="100" cy="115" rx="6" ry="4" fill="#0B1220" opacity="0.7"/>

  <!-- Mouth -->
  <path d="M90 125 Q100 135 110 125" stroke="#0B1220" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Whiskers -->
  <g stroke="#0B1220" stroke-width="1.5" opacity="0.5">
    <path d="M60 110 L40 105"/>
    <path d="M60 115 L38 115"/>
    <path d="M60 120 L40 125"/>
    <path d="M140 110 L160 105"/>
    <path d="M140 115 L162 115"/>
    <path d="M140 120 L160 125"/>
  </g>

  <!-- Circuit Tail -->
  <g stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M155 100 Q180 90 195 100 Q210 110 195 120">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Tail nodes -->
  <g fill="#38BDF8">
    <circle cx="165" cy="97" r="4">
      <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="95" r="4">
      <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="200" cy="105" r="4">
      <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>

  <!-- Code brackets on cheeks -->
  <g stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.7">
    <text x="45" y="105" font-family="monospace" font-size="20" font-weight="bold" fill="#38BDF8" opacity="0.7">{</text>
    <text x="148" y="105" font-family="monospace" font-size="20" font-weight="bold" fill="#38BDF8" opacity="0.7">}</text>
  </g>

  <!-- Small floating code particles -->
  <g fill="#38BDF8" opacity="0.6">
    <circle cx="20" cy="60" r="2">
      <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="170" r="2">
      <animate attributeName="cy" values="170;160;170" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="15" cy="140" r="1.5">
      <animate attributeName="cx" values="15;25;15" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="30" r="1.5">
      <animate attributeName="cx" values="185;175;185" dur="4s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>
</svg>