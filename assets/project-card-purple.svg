<svg width="100%" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24153B"/>
      <stop offset="100%" stop-color="#1A0F2E"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="320" height="180" rx="12" fill="url(#cardBg)" stroke="#3D2A5C" stroke-width="1.5" filter="url(#cardGlow)">
    <animate attributeName="stroke" values="#3D2A5C;#7C3AED;#3D2A5C" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Inner accent line top -->
  <rect x="12" y="12" width="296" height="2" rx="1" fill="url(#violetGrad)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Icon area -->
  <g transform="translate(16, 28)">
    <circle cx="24" cy="24" r="26" fill="#7C3AED" opacity="0.15"/>
    <animate attributeName="r" values="26;30;26" dur="3s" repeatCount="indefinite" begin="0.2s"/>
    <!-- Icon placeholder: gear/tool symbol -->
    <g transform="translate(24, 24)" fill="none" stroke="url(#violetGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="14"/>
      <!-- Gear teeth via small rects around circle -->
      <g>
        <rect x="-3" y="-18" width="6" height="6" rx="1" fill="url(#violetGrad)"/>
        <rect x="-3" y="12" width="6" height="6" rx="1" fill="url(#violetGrad)"/>
        <rect x="-18" y="-3" width="6" height="6" rx="1" fill="url(#violetGrad)"/>
        <rect x="12" y="-3" width="6" height="6" rx="1" fill="url(#violetGrad)"/>
        <rect x="-14" y="-14" width="6" height="6" rx="1" fill="url(#violetGrad)"/>
        <rect x="8" y="8" width="6" height="6" rx="1" fill="url(#violetGrad)"/>
        <rect x="-14" y="8" width="6" height="6" rx="1" fill="url(#violetGrad)"/>
        <rect x="8" y="-14" width="6" height="6" rx="1" fill="url(#violetGrad)"/>
      </g>
    </g>
  </g>

  <!-- Project title -->
  <text x="56" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
    FIXKO PROJECT
  </text>

  <!-- Status dot (animated pulse) -->
  <circle cx="290" cy="38" r="6" fill="#22C55E" filter="url(#textGlow)">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="262" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    Active
  </text>

  <!-- Description -->
  <text x="16" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#CBD5E1">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze"/>
    A modern web build — custom CSS design, TypeScript logic, and a PHP backend.
  </text>

  <!-- Tech stack pills -->
  <g transform="translate(16, 92)">
    <rect x="0" y="0" width="52" height="18" rx="9" fill="#7C3AED" opacity="0.25"/>
    <rect x="0" y="0" width="52" height="18" rx="9" fill="none" stroke="#7C3AED" stroke-width="0.8" opacity="0.5"/>
    <text x="26" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#D8B4FE">CSS</text>
  </g>
  <g transform="translate(72, 92)">
    <rect x="0" y="0" width="52" height="18" rx="9" fill="#06B6D4" opacity="0.2"/>
    <rect x="0" y="0" width="52" height="18" rx="9" fill="none" stroke="#06B6D4" stroke-width="0.8" opacity="0.5"/>
    <text x="26" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#22D3EE">TypeScript</text>
  </g>
  <g transform="translate(128, 92)">
    <rect x="0" y="0" width="52" height="18" rx="9" fill="#C026D3" opacity="0.2"/>
    <rect x="0" y="0" width="52" height="18" rx="9" fill="none" stroke="#C026D3" stroke-width="0.8" opacity="0.5"/>
    <text x="26" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#E879F9">PHP</text>
  </g>

  <!-- Secondary description line (optional) -->
  <text x="16" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze"/>
    Multi-language build: CSS · TypeScript · HTML · PHP
  </text>

  <!-- Bottom action hint (optional CTA text) -->
  <text x="16" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
    ★ 2 stars · updated Sep 2026
  </text>

  <!-- Small decoration: bottom-right corner accent -->
  <rect x="300" y="164" width="16" height="2" rx="1" fill="url(#cyanGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
</svg>
