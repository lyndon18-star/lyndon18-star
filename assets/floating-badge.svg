<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="badgeGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Badge 1: Open Source -->
  <g transform="translate(0, 0)">
    <rect x="10" y="10" width="180" height="60" rx="12" fill="#161B22" stroke="url(#badgeGrad1)" stroke-width="1.5" filter="url(#badgeGlow)">
      <animate attributeName="stroke-width" values="1.5;3;1.5" dur="3s" repeatCount="indefinite" />
    </rect>

    <circle cx="35" cy="40" r="18" fill="url(#badgeGrad1)" opacity="0.2">
      <animate attributeName="r" values="18;22;18" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <svg x="23" y="28" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#badgeGrad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 6v6l4 2"/>
    </svg>

    <text x="65" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Open Source</text>
    <text x="65" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#8B949E">Contributor</text>

    <!-- Pulse dot -->
    <circle cx="170" cy="40" r="5" fill="url(#badgeGrad1)">
      <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>