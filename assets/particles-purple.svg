<svg width="100%" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="particleViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="particleCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="particleMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="particleTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="particleAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Large floating orbs -->
  <g opacity="0.15">
    <circle cx="150" cy="80" r="60" fill="url(#particleViolet)">
      <animate attributeName="cx" values="150;180;150" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;60;80" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="r" values="60;75;60" dur="8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="140" r="50" fill="url(#particleCyan)">
      <animate attributeName="cx" values="1050;1020;1050" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;160;140" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="r" values="50;65;50" dur="10s" repeatCount="indefinite"/>
    </circle>

    <circle cx="600" cy="200" r="80" fill="url(#particleMagenta)">
      <animate attributeName="cy" values="200;170;200" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="r" values="80;95;80" dur="12s" repeatCount="indefinite"/>
    </circle>

    <circle cx="300" cy="180" r="45" fill="url(#particleTeal)">
      <animate attributeName="cx" values="300;270;300" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;200;180" dur="17s" repeatCount="indefinite"/>
    </circle>

    <circle cx="900" cy="40" r="55" fill="url(#particleAmber)">
      <animate attributeName="cx" values="900;930;900" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;20;40" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Layer 2: Medium particles -->
  <g opacity="0.35">
    <!-- Row 1 -->
    <circle cx="80" cy="40" r="4" fill="url(#particleViolet)">
      <animate attributeName="cy" values="40;28;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="80;88;80" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="220" cy="65" r="3" fill="url(#particleCyan)">
      <animate attributeName="cy" values="65;52;65" dur="5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <circle cx="380" cy="30" r="5" fill="url(#particleMagenta)">
      <animate attributeName="cy" values="30;42;30" dur="3.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>

    <circle cx="540" cy="55" r="3.5" fill="url(#particleTeal)">
      <animate attributeName="cy" values="55;42;55" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>

    <circle cx="680" cy="35" r="4" fill="url(#particleViolet)">
      <animate attributeName="cy" values="35;25;35" dur="3.8s" repeatCount="indefinite" begin="0.8s"/>
    </circle>

    <circle cx="840" cy="70" r="3" fill="url(#particleCyan)">
      <animate attributeName="cy" values="70;58;70" dur="5.2s" repeatCount="indefinite" begin="1.2s"/>
    </circle>

    <circle cx="980" cy="45" r="4.5" fill="url(#particleMagenta)">
      <animate attributeName="cy" values="45;35;45" dur="4.2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>

    <circle cx="1120" cy="60" r="3" fill="url(#particleTeal)">
      <animate attributeName="cy" values="60;50;60" dur="4.8s" repeatCount="indefinite" begin="0.6s"/>
    </circle>

    <!-- Row 2 -->
    <circle cx="140" cy="110" r="3.5" fill="url(#particleAmber)">
      <animate attributeName="cy" values="110;98;110" dur="4s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="cx" values="140;150;140" dur="3.5s" repeatCount="indefinite" begin="0.7s"/>
    </circle>

    <circle cx="300" cy="135" r="4" fill="url(#particleViolet)">
      <animate attributeName="cy" values="135;122;135" dur="4.5s" repeatCount="indefinite" begin="1.3s"/>
    </circle>

    <circle cx="460" cy="105" r="3" fill="url(#particleCyan)">
      <animate attributeName="cy" values="105;93;105" dur="3.8s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite" begin="0.9s"/>
    </circle>

    <circle cx="620" cy="120" r="4.5" fill="url(#particleMagenta)">
      <animate attributeName="cy" values="120;108;120" dur="4.2s" repeatCount="indefinite" begin="1.6s"/>
      <animate attributeName="r" values="4.5;6;4.5" dur="3s" repeatCount="indefinite" begin="1.6s"/>
    </circle>

    <circle cx="780" cy="110" r="3.5" fill="url(#particleTeal)">
      <animate attributeName="cy" values="110;100;110" dur="3.7s" repeatCount="indefinite" begin="0.4s"/>
    </circle>

    <circle cx="940" cy="135" r="4" fill="url(#particleAmber)">
      <animate attributeName="cy" values="135;123;135" dur="4.8s" repeatCount="indefinite" begin="1.1s"/>
    </circle>

    <circle cx="1080" cy="105" r="3" fill="url(#particleViolet)">
      <animate attributeName="cy" values="105;95;105" dur="4.3s" repeatCount="indefinite" begin="0.8s"/>
    </circle>

    <!-- Row 3 -->
    <circle cx="60" cy="180" r="3" fill="url(#particleCyan)">
      <animate attributeName="cy" values="180;168;180" dur="5s" repeatCount="indefinite" begin="1.8s"/>
    </circle>

    <circle cx="220" cy="175" r="4" fill="url(#particleMagenta)">
      <animate attributeName="cy" values="175;163;175" dur="4.3s" repeatCount="indefinite" begin="0.6s"/>
    </circle>

    <circle cx="380" cy="190" r="3.5" fill="url(#particleTeal)">
      <animate attributeName="cy" values="190;178;190" dur="3.9s" repeatCount="indefinite" begin="1.4s"/>
    </circle>

    <circle cx="540" cy="185" r="4" fill="url(#particleViolet)">
      <animate attributeName="cy" values="185;173;185" dur="4.7s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="2.8s" repeatCount="indefinite" begin="0.2s"/>
    </circle>

    <circle cx="700" cy="170" r="3" fill="url(#particleCyan)">
      <animate attributeName="cy" values="170;158;170" dur="5.1s" repeatCount="indefinite" begin="1.7s"/>
    </circle>

    <circle cx="860" cy="195" r="4.5" fill="url(#particleMagenta)">
      <animate attributeName="cy" values="195;183;195" dur="4.4s" repeatCount="indefinite" begin="0.9s"/>
    </circle>

    <circle cx="1020" cy="180" r="3.5" fill="url(#particleTeal)">
      <animate attributeName="cy" values="180;170;180" dur="4.1s" repeatCount="indefinite" begin="1.9s"/>
    </circle>
  </g>

  <!-- Layer 3: Floating code symbols -->
  <g font-family="monospace" font-size="20" font-weight="700" fill="#7C3AED" opacity="0.12">
    <text x="100" y="80">{</text>
    <text x="260" y="95">}</text>
    <text x="440" y="70">[</text>
    <text x="600" y="105">]</text>
    <text x="760" y="85">(</text>
    <text x="920" y="75">)</text>
    <text x="180" y="150"><</text>
    <text x="340" y="165">></text>
    <text x="520" y="145">=</text>
    <text x="680" y="155">=</text>
    <text x="840" y="165">></text>
    <text x="980" y="150">{</text>
    <text x="1140" y="155">}</text>
  </g>

  <!-- Layer 4: Animated code symbols with movement -->
  <g font-family="monospace" font-size="24" font-weight="700" fill="#A855F7" opacity="0.18">
    <text x="180" y="55">
      <animate attributeName="y" values="55;46;55" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.4;0.18" dur="2s" repeatCount="indefinite"/>
    >{</text>
    <text x="340" y="120">
      <animate attributeName="y" values="120;110;120" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.18;0.4;0.18" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    >}</text>
    <text x="600" y="60">
      <animate attributeName="y" values="60;50;60" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.18;0.4;0.18" dur="3s" repeatCount="indefinite" begin="1s"/>
    >[</text>
    <text x="760" y="130">
      <animate attributeName="y" values="130;120;130" dur="3.2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.18;0.4;0.18" dur="2.2s" repeatCount="indefinite" begin="1.5s"/>
    >]</text>
    <text x="500" y="25">
      <animate attributeName="y" values="25;18;25" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2s" repeatCount="indefinite" begin="0.8s"/>
    >=</text>
    <text x="860" y="40">
      <animate attributeName="y" values="40;32;40" dur="3.5s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
    >></text>
  </g>

  <!-- Layer 5: Circuit line connections -->
  <g stroke="#7C3AED" stroke-width="0.5" stroke-dasharray="8 6" opacity="0.1">
    <path d="M100 60 Q200 30 300 60 T500 60 T700 60 T900 60 T1100 60">
      <animate attributeName="stroke-dashoffset" from="0" to="28" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M50 140 Q200 120 350 140 T650 140 T950 140 T1150 140">
      <animate attributeName="stroke-dashoffset" from="0" to="28" dur="7s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M0 190 Q150 210 300 190 T600 190 T900 190 T1200 190">
      <animate attributeName="stroke-dashoffset" from="0" to="28" dur="5s" repeatCount="indefinite" begin="2s"/>
    </path>
  </g>
</svg>