<svg width="100%" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="arcadeBg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#1A0F2E"/>
      <stop offset="60%" stop-color="#0F0A1A"/>
      <stop offset="100%" stop-color="#080510"/>
    </radialGradient>
    <linearGradient id="arcadeTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="arcadeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Alien sprites (pixel-style) -->
    <g id="alienViolet">
      <rect x="-8" y="-4" width="16" height="8" rx="1" fill="#A855F7"/>
      <rect x="-6" y="-7" width="2" height="3" fill="#A855F7"/>
      <rect x="4" y="-7" width="2" height="3" fill="#A855F7"/>
      <rect x="-6" y="4" width="2" height="3" fill="#A855F7"/>
      <rect x="4" y="4" width="2" height="3" fill="#A855F7"/>
      <rect x="-4" y="-1" width="2" height="2" fill="#0F0A1A"/>
      <rect x="2" y="-1" width="2" height="2" fill="#0F0A1A"/>
    </g>
    <g id="alienCyan">
      <rect x="-8" y="-4" width="16" height="8" rx="1" fill="#22D3EE"/>
      <rect x="-6" y="-7" width="2" height="3" fill="#22D3EE"/>
      <rect x="4" y="-7" width="2" height="3" fill="#22D3EE"/>
      <rect x="-6" y="4" width="2" height="3" fill="#22D3EE"/>
      <rect x="4" y="4" width="2" height="3" fill="#22D3EE"/>
      <rect x="-4" y="-1" width="2" height="2" fill="#0F0A1A"/>
      <rect x="2" y="-1" width="2" height="2" fill="#0F0A1A"/>
    </g>
    <g id="alienMagenta">
      <rect x="-8" y="-4" width="16" height="8" rx="1" fill="#F472B6"/>
      <rect x="-6" y="-7" width="2" height="3" fill="#F472B6"/>
      <rect x="4" y="-7" width="2" height="3" fill="#F472B6"/>
      <rect x="-6" y="4" width="2" height="3" fill="#F472B6"/>
      <rect x="4" y="4" width="2" height="3" fill="#F472B6"/>
      <rect x="-4" y="-1" width="2" height="2" fill="#0F0A1A"/>
      <rect x="2" y="-1" width="2" height="2" fill="#0F0A1A"/>
    </g>

    <!-- Player ship sprite -->
    <path id="shipSprite" d="M0,-9 L9,5 L4,5 L4,9 L-4,9 L-4,5 L-9,5 Z"/>
  </defs>

  <!-- Background + frame -->
  <rect width="1200" height="220" rx="12" fill="url(#arcadeBg)"/>
  <rect x="1" y="1" width="1198" height="218" rx="11" fill="none" stroke="#3D2A5C" stroke-width="1.5">
    <animate attributeName="stroke" values="#3D2A5C;#7C3AED;#3D2A5C" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Twinkling background stars -->
  <g fill="#D8B4FE">
    <circle cx="140" cy="60" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="40" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="58" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="44" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="170" r="1.2" opacity="0.35"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="176" r="1.2" opacity="0.35"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HUD: title + fake score ticker + hi-score -->
  <text x="600" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="url(#arcadeTitle)" letter-spacing="4">👾 ARCADE MODE</text>
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
    <text x="40" y="30" opacity="1">
      SCORE 001240
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.44;0.5;0.94;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="30" opacity="0">
      SCORE 002470
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.5;0.94;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="1160" y="30" text-anchor="end" fill="#F472B6">HI-SCORE 009999</text>
  </g>

  <!-- Alien fleet: stepped march left-right (calcMode discrete = authentic snapping) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;14 0;28 0;14 0;0 0;-14 0;-28 0;-14 0;0 0"
      calcMode="discrete" dur="5.6s" repeatCount="indefinite"/>
    <g>
      <use href="#alienViolet" x="230" y="52"/><use href="#alienViolet" x="310" y="52"/><use href="#alienViolet" x="390" y="52"/><use href="#alienViolet" x="470" y="52"/><use href="#alienViolet" x="550" y="52"/><use href="#alienViolet" x="630" y="52"/><use href="#alienViolet" x="710" y="52"/><use href="#alienViolet" x="790" y="52"/><use href="#alienViolet" x="870" y="52"/><use href="#alienViolet" x="950" y="52"/>
      <use href="#alienCyan" x="230" y="76"/><use href="#alienCyan" x="310" y="76"/><use href="#alienCyan" x="390" y="76"/><use href="#alienCyan" x="470" y="76"/><use href="#alienCyan" x="550" y="76"/><use href="#alienCyan" x="630" y="76"/><use href="#alienCyan" x="710" y="76"/><use href="#alienCyan" x="790" y="76"/><use href="#alienCyan" x="870" y="76"/><use href="#alienCyan" x="950" y="76"/>
      <use href="#alienMagenta" x="230" y="100"/><use href="#alienMagenta" x="310" y="100"/><use href="#alienMagenta" x="390" y="100"/><use href="#alienMagenta" x="470" y="100"/><use href="#alienMagenta" x="550" y="100"/><use href="#alienMagenta" x="630" y="100"/><use href="#alienMagenta" x="710" y="100"/><use href="#alienMagenta" x="790" y="100"/><use href="#alienMagenta" x="870" y="100"/><use href="#alienMagenta" x="950" y="100"/>
    </g>
  </g>

  <!-- Blinking PRESS START -->
  <text x="600" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#F472B6" letter-spacing="3" filter="url(#arcadeGlow)">
    PRESS START
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </text>

  <!-- Bunkers -->
  <g fill="#7C3AED" opacity="0.25" stroke="#3D2A5C" stroke-width="1">
    <rect x="255" y="152" width="70" height="12" rx="3"/>
    <rect x="465" y="152" width="70" height="12" rx="3"/>
    <rect x="675" y="152" width="70" height="12" rx="3"/>
    <rect x="885" y="152" width="70" height="12" rx="3"/>
  </g>

  <!-- Player ship gliding + photon fire looping from its nose -->
  <g transform="translate(640,192)" filter="url(#arcadeGlow)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0;-70 0;0 0;70 0;0 0" dur="7s" repeatCount="indefinite"/>
    <use href="#shipSprite" fill="#22D3EE"/>
    <rect x="-1.5" y="-20" width="3" height="10" rx="1" fill="#22D3EE" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 14;0 -128" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Alien bomb dropping -->
  <g transform="translate(830,104)">
    <rect x="-1.5" y="0" width="3" height="10" rx="1" fill="#F472B6" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 78" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom HUD: lives + credits -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">
    <use href="#shipSprite" transform="translate(46,206) scale(0.7)" fill="#22D3EE" opacity="0.8"/>
    <use href="#shipSprite" transform="translate(66,206) scale(0.7)" fill="#22D3EE" opacity="0.8"/>
    <use href="#shipSprite" transform="translate(86,206) scale(0.7)" fill="#22D3EE" opacity="0.8"/>
    <text x="100" y="210">LIVES</text>
    <text x="1160" y="210" text-anchor="end">CREDIT 01 — INSERT COIN</text>
  </g>
</svg>
