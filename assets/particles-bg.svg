<svg width="100%" height="200" viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="particleGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="particleGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="particleGlow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Floating geometric particles -->
  <g opacity="0.4">
    <!-- Row 1 -->
    <circle cx="50" cy="30" r="3" fill="url(#particleGlow)">
      <animate attributeName="cy" values="30;20;30" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cx" values="50;55;50" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="50" r="2" fill="url(#particleGlow2)">
      <animate attributeName="cy" values="50;40;50" dur="5s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="320" cy="25" r="4" fill="url(#particleGlow3)">
      <animate attributeName="cy" values="25;35;25" dur="3.5s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite" begin="1s" />
    </circle>
    <circle cx="480" cy="40" r="2.5" fill="url(#particleGlow4)">
      <animate attributeName="cy" values="40;30;40" dur="4.5s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" begin="1.5s" />
    </circle>
    <circle cx="620" cy="30" r="3" fill="url(#particleGlow)">
      <animate attributeName="cy" values="30;22;30" dur="3.8s" repeatCount="indefinite" begin="0.8s" />
    </circle>
    <circle cx="780" cy="55" r="2" fill="url(#particleGlow2)">
      <animate attributeName="cy" values="55;45;55" dur="5.2s" repeatCount="indefinite" begin="1.2s" />
    </circle>
    <circle cx="920" cy="35" r="3.5" fill="url(#particleGlow3)">
      <animate attributeName="cy" values="35;28;35" dur="4.2s" repeatCount="indefinite" begin="0.3s" />
    </circle>

    <!-- Row 2 -->
    <circle cx="100" cy="100" r="2.5" fill="url(#particleGlow4)">
      <animate attributeName="cy" values="100;90;100" dur="4s" repeatCount="indefinite" begin="0.7s" />
      <animate attributeName="cx" values="100;108;100" dur="3.5s" repeatCount="indefinite" begin="0.7s" />
    </circle>
    <circle cx="250" cy="120" r="3" fill="url(#particleGlow)">
      <animate attributeName="cy" values="120;110;120" dur="4.5s" repeatCount="indefinite" begin="1.3s" />
    </circle>
    <circle cx="400" cy="95" r="2" fill="url(#particleGlow2)">
      <animate attributeName="cy" values="95;85;95" dur="3.8s" repeatCount="indefinite" begin="0.9s" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite" begin="0.9s" />
    </circle>
    <circle cx="550" cy="110" r="3.5" fill="url(#particleGlow3)">
      <animate attributeName="cy" values="110;100;110" dur="4.2s" repeatCount="indefinite" begin="1.6s" />
      <animate attributeName="r" values="3.5;5;3.5" dur="3s" repeatCount="indefinite" begin="1.6s" />
    </circle>
    <circle cx="700" cy="100" r="2.5" fill="url(#particleGlow4)">
      <animate attributeName="cy" values="100;92;100" dur="3.7s" repeatCount="indefinite" begin="0.4s" />
    </circle>
    <circle cx="850" cy="125" r="3" fill="url(#particleGlow)">
      <animate attributeName="cy" values="125;115;125" dur="4.8s" repeatCount="indefinite" begin="1.1s" />
    </circle>

    <!-- Row 3 -->
    <circle cx="30" cy="170" r="2" fill="url(#particleGlow2)">
      <animate attributeName="cy" values="170;160;170" dur="5s" repeatCount="indefinite" begin="1.8s" />
    </circle>
    <circle cx="180" cy="165" r="3" fill="url(#particleGlow3)">
      <animate attributeName="cy" values="165;155;165" dur="4.3s" repeatCount="indefinite" begin="0.6s" />
    </circle>
    <circle cx="350" cy="180" r="2.5" fill="url(#particleGlow4)">
      <animate attributeName="cy" values="180;170;180" dur="3.9s" repeatCount="indefinite" begin="1.4s" />
    </circle>
    <circle cx="500" cy="175" r="3" fill="url(#particleGlow)">
      <animate attributeName="cy" values="175;165;175" dur="4.7s" repeatCount="indefinite" begin="0.2s" />
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite" begin="0.2s" />
    </circle>
    <circle cx="680" cy="160" r="2" fill="url(#particleGlow2)">
      <animate attributeName="cy" values="160;150;160" dur="5.1s" repeatCount="indefinite" begin="1.7s" />
    </circle>
    <circle cx="820" cy="185" r="3.5" fill="url(#particleGlow3)">
      <animate attributeName="cy" values="185;175;185" dur="4.4s" repeatCount="indefinite" begin="0.9s" />
    </circle>
    <circle cx="960" cy="170" r="2.5" fill="url(#particleGlow4)">
      <animate attributeName="cy" values="170;162;170" dur="4.1s" repeatCount="indefinite" begin="1.9s" />
    </circle>
  </g>

  <!-- Floating code brackets -->
  <g font-family="monospace" font-size="16" font-weight="bold" fill="#38BDF8" opacity="0.15">
    <text x="80" y="70">{</text>
    <text x="220" y="85">}</text>
    <text x="380" y="60">[</text>
    <text x="520" y="95">]</text>
    <text x="680" y="75">(</text>
    <text x="820" y="65">)</text>
    <text x="120" y="140"><</text>
    <text x="280" y="155">></text>
    <text x="450" y="135">=</text>
    <text x="600" y="145">=</text>
    <text x="750" y="155">></text>
    <text x="900" y="140">{</text>
  </g>

  <!-- Animated code brackets with movement -->
  <g font-family="monospace" font-size="20" font-weight="bold" fill="#38BDF8" opacity="0.25">
    <text x="150" y="45">
      <animate attributeName="y" values="45;38;45" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2s" repeatCount="indefinite" />
    >{</text>
    <text x="300" y="110">
      <animate attributeName="y" values="110;102;110" dur="3.5s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2.5s" repeatCount="indefinite" begin="0.5s" />
    >}</text>
    <text x="580" y="50">
      <animate attributeName="y" values="50;42;50" dur="4s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3s" repeatCount="indefinite" begin="1s" />
    >[</text>
    <text x="720" y="120">
      <animate attributeName="y" values="120;112;120" dur="3.2s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2.2s" repeatCount="indefinite" begin="1.5s" />
    >]</text>
  </g>
</svg>