<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="radarStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background grid circles -->
  <g stroke="url(#radarStroke)" stroke-width="1" fill="none" opacity="0.3">
    <circle cx="200" cy="200" r="35">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="200" r="70">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="200" cy="200" r="105">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite" begin="1s" />
    </circle>
    <circle cx="200" cy="200" r="140">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite" begin="1.5s" />
    </circle>
    <circle cx="200" cy="200" r="175">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite" begin="2s" />
    </circle>
  </g>

  <!-- Axis lines -->
  <g stroke="url(#radarStroke)" stroke-width="1" opacity="0.4">
    <line x1="200" y1="200" x2="200" y2="25">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="200" y1="200" x2="375" y2="200">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.3s" />
    </line>
    <line x1="200" y1="200" x2="200" y2="375">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.6s" />
    </line>
    <line x1="200" y1="200" x2="25" y2="200">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.9s" />
    </line>
    <line x1="200" y1="200" x2="345" y2="55">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="1.2s" />
    </line>
    <line x1="200" y1="200" x2="345" y2="345">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="1.5s" />
    </line>
    <line x1="200" y1="200" x2="55" y2="345">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="1.8s" />
    </line>
    <line x1="200" y1="200" x2="55" y2="55">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="2.1s" />
    </line>
  </g>

  <!-- Skill polygon (animated) -->
  <polygon points="200,45 335,70 370,200 335,330 200,355 65,330 30,200 65,70"
           fill="url(#radarGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#glow)" opacity="0.8">
    <animate attributeName="points" values="
      200,45 335,70 370,200 335,330 200,355 65,330 30,200 65,70;
      200,50 320,85 355,200 320,315 200,350 80,315 45,200 80,85;
      200,45 335,70 370,200 335,330 200,355 65,330 30,200 65,70
    " dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite" />
  </polygon>

  <!-- Center pulse -->
  <circle cx="200" cy="200" r="15" fill="url(#centerGlow)" filter="url(#glow)">
    <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="200" r="8" fill="#38BDF8">
    <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Skill labels with animations -->
  <g font-family="system-ui, sans-serif" font-size="11" fill="#E2E8F0" font-weight="500">
    <text x="200" y="20" text-anchor="middle" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />Frontend
    </text>
    <text x="375" y="205" text-anchor="start" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="0.3s" />React/Next.js
    </text>
    <text x="200" y="385" text-anchor="middle" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="0.6s" />Backend
    </text>
    <text x="10" y="205" text-anchor="end" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="0.9s" />Java/Python
    </text>
    <text x="365" y="45" text-anchor="start" opacity="0.6" font-size="9">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite" begin="1.2s" />TypeScript
    </text>
    <text x="365" y="365" text-anchor="start" opacity="0.6" font-size="9">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite" begin="1.5s" />Databases
    </text>
    <text x="10" y="365" text-anchor="end" opacity="0.6" font-size="9">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite" begin="1.8s" />DevOps
    </text>
    <text x="10" y="45" text-anchor="end" opacity="0.6" font-size="9">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite" begin="2.1s" />Mobile
    </text>
  </g>

  <!-- Proficiency dots on axes -->
  <g fill="#38BDF8">
    <circle cx="200" cy="65" r="5">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="325" cy="200" r="4.5">
      <animate attributeName="r" values="4.5;7;4.5" dur="2s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    <circle cx="200" cy="335" r="5">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite" begin="0.6s" />
    </circle>
    <circle cx="75" cy="200" r="4">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" begin="0.9s" />
    </circle>
    <circle cx="310" cy="80" r="4">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" begin="1.2s" />
    </circle>
    <circle cx="310" cy="320" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" begin="1.5s" />
    </circle>
    <circle cx="90" cy="320" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" begin="1.8s" />
    </circle>
    <circle cx="90" cy="80" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" begin="2.1s" />
    </circle>
  </g>

  <!-- Rotating accent ring -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="8 12" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>