<svg width="800" height="160" viewBox="0 0 800 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="accentGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="accentGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="cardGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stat Card 1: Repositories -->
  <g transform="translate(20, 10)">
    <rect width="180" height="140" rx="16" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#30363D;#38BDF8;#30363D" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Icon -->
    <g transform="translate(90, 35)">
      <circle r="24" fill="url(#accentGrad1)" opacity="0.2">
        <animate attributeName="r" values="24;28;24" dur="3s" repeatCount="indefinite" />
      </circle>
      <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#accentGrad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 10-10"/>
        <path d="M6 15l6-6 10 10"/>
      </svg>
    </g>

    <!-- Counter animation -->
    <text x="90" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#accentGrad1)">
      <tspan id="count1">0</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- Label -->
    <text x="90" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E" font-weight="500">
      Repositories
    </text>

    <!-- Animated underline -->
    <line x1="50" y1="122" x2="130" y2="122" stroke="url(#accentGrad1)" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="x1" values="50;40;50" dur="2s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="x2" values="130;140;130" dur="2s" begin="1s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Stat Card 2: Commits -->
  <g transform="translate(220, 10)">
    <rect width="180" height="140" rx="16" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#30363D;#22C55E;#30363D" dur="4s" repeatCount="indefinite" begin="0.3s" />
    </rect>

    <g transform="translate(90, 35)">
      <circle r="24" fill="url(#accentGrad2)" opacity="0.2">
        <animate attributeName="r" values="24;28;24" dur="3s" repeatCount="indefinite" begin="0.3s" />
      </circle>
      <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#accentGrad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
    </g>

    <text x="90" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#accentGrad2)">
      <tspan id="count2">0</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze"/>
    </text>

    <text x="90" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E" font-weight="500">
      Commits
    </text>

    <line x1="50" y1="122" x2="130" y2="122" stroke="url(#accentGrad2)" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.3s" repeatCount="indefinite" />
      <animate attributeName="x1" values="50;40;50" dur="2s" begin="1.3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="130;140;130" dur="2s" begin="1.3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Stat Card 3: Projects Shipped -->
  <g transform="translate(420, 10)">
    <rect width="180" height="140" rx="16" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#30363D;#FBBF24;#30363D" dur="4s" repeatCount="indefinite" begin="0.6s" />
    </rect>

    <g transform="translate(90, 35)">
      <circle r="24" fill="url(#accentGrad3)" opacity="0.2">
        <animate attributeName="r" values="24;28;24" dur="3s" repeatCount="indefinite" begin="0.6s" />
      </circle>
      <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#accentGrad3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </g>

    <text x="90" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#accentGrad3)">
      <tspan id="count3">0</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze"/>
    </text>

    <text x="90" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E" font-weight="500">
      Projects Shipped
    </text>

    <line x1="50" y1="122" x2="130" y2="122" stroke="url(#accentGrad3)" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.6s" repeatCount="indefinite" />
      <animate attributeName="x1" values="50;40;50" dur="2s" begin="1.6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="130;140;130" dur="2s" begin="1.6s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Stat Card 4: Years Coding -->
  <g transform="translate(620, 10)">
    <rect width="180" height="140" rx="16" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#30363D;#A78BFA;#30363D" dur="4s" repeatCount="indefinite" begin="0.9s" />
    </rect>

    <g transform="translate(90, 35)">
      <circle r="24" fill="url(#accentGrad4)" opacity="0.2">
        <animate attributeName="r" values="24;28;24" dur="3s" repeatCount="indefinite" begin="0.9s" />
      </circle>
      <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#accentGrad4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </g>

    <text x="90" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#accentGrad4)">
      <tspan id="count4">0</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
    </text>

    <text x="90" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E" font-weight="500">
      Years Coding
    </text>

    <line x1="50" y1="122" x2="130" y2="122" stroke="url(#accentGrad4)" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.9s" repeatCount="indefinite" />
      <animate attributeName="x1" values="50;40;50" dur="2s" begin="1.9s" repeatCount="indefinite" />
      <animate attributeName="x2" values="130;140;130" dur="2s" begin="1.9s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Floating particles between cards -->
  <g fill="#38BDF8" opacity="0.3">
    <circle cx="205" cy="50" r="2">
      <animate attributeName="cy" values="50;40;50" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="405" cy="60" r="1.5">
      <animate attributeName="cy" values="60;50;60" dur="3.5s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="605" cy="45" r="2">
      <animate attributeName="cy" values="45;38;45" dur="2.8s" repeatCount="indefinite" begin="1s" />
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.2s" repeatCount="indefinite" begin="1s" />
    </circle>
    <circle cx="205" cy="130" r="1.5">
      <animate attributeName="cy" values="130;120;130" dur="4s" repeatCount="indefinite" begin="1.5s" />
    </circle>
    <circle cx="405" cy="120" r="2">
      <animate attributeName="cy" values="120;110;120" dur="3.8s" repeatCount="indefinite" begin="0.8s" />
    </circle>
    <circle cx="605" cy="135" r="1.5">
      <animate attributeName="cy" values="135;125;135" dur="3.2s" repeatCount="indefinite" begin="1.2s" />
    </circle>
  </g>

  <!-- Connecting circuit lines between cards -->
  <g stroke="#38BDF8" stroke-width="1" stroke-dasharray="6 4" opacity="0.2">
    <path d="M200 80 Q260 60 320 80">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M400 80 Q460 60 520 80">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="3s" repeatCount="indefinite" begin="0.5s" />
    </path>
    <path d="M600 80 Q660 60 720 80">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="3s" repeatCount="indefinite" begin="1s" />
    </path>
  </g>
</svg>