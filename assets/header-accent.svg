<svg width="100%" height="80" viewBox="0 0 1000 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Top circuit line -->
  <path d="M0 25 Q200 5 500 25 T1000 25" stroke="url(#headerGrad)" stroke-width="1.5" fill="none" stroke-dasharray="8 4" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="2s" repeatCount="indefinite" />
  </path>
  <!-- Bottom circuit line -->
  <path d="M0 55 Q200 75 500 55 T1000 55" stroke="url(#headerGrad)" stroke-width="1.5" fill="none" stroke-dasharray="8 4" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="2s" repeatCount="indefinite" begin="0.5s" />
  </path>
  <!-- Center pulse ring -->
  <circle cx="500" cy="40" r="12" fill="none" stroke="url(#pulseGrad)" stroke-width="2">
    <animate attributeName="r" values="12;25;12" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="2;1;2" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="40" r="18" fill="none" stroke="url(#pulseGrad)" stroke-width="1.5">
    <animate attributeName="r" values="18;32;18" dur="2s" repeatCount="indefinite" begin="0.5s" />
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s" />
  </circle>
</svg>