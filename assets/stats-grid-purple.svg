<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card gradients -->
    <linearGradient id="cardGradBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24153B"/>
      <stop offset="100%" stop-color="#1A0F2E"/>
    </linearGradient>

    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="accentMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="cardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Icon gradients -->
    <radialGradient id="iconGlowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card 1: Repositories -->
  <g transform="translate(15, 15)">
    <rect width="210" height="170" rx="16" fill="url(#cardGradBase)" stroke="#3D2A5C" stroke-width="1.5" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#3D2A5C;#7C3AED;#3D2A5C" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Icon glow -->
    <circle cx="105" cy="45" r="40" fill="url(#iconGlowViolet)">
      <animate attributeName="r" values="40;48;40" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Icon -->
    <g transform="translate(87, 27)">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="url(#accentViolet)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
      </svg>
    </g>

    <!-- Counter -->
    <text x="105" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#accentViolet)" filter="url(#textShadow)">
      11
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- Label -->
    <text x="105" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">
      Repositories
    </text>

    <!-- Animated bar -->
    <rect x="30" y="160" width="150" height="3" rx="1.5" fill="#3D2A5C"/>
    <rect x="30" y="160" width="0" height="3" rx="1.5" fill="url(#accentViolet)">
      <animate attributeName="width" values="0;150" dur="1.5s" begin="0.4s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 2: Commits -->
  <g transform="translate(240, 15)">
    <rect width="210" height="170" rx="16" fill="url(#cardGradBase)" stroke="#3D2A5C" stroke-width="1.5" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#3D2A5C;#06B6D4;#3D2A5C" dur="5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="5s" repeatCount="indefinite" begin="1s"/>
    </rect>

    <circle cx="105" cy="45" r="40" fill="url(#iconGlowCyan)">
      <animate attributeName="r" values="40;48;40" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>

    <g transform="translate(87, 27)">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="url(#accentCyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
    </g>

    <text x="105" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#accentCyan)" filter="url(#textShadow)">
      340
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
    </text>

    <text x="105" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">
      Commits
    </text>

    <rect x="30" y="160" width="150" height="3" rx="1.5" fill="#3D2A5C"/>
    <rect x="30" y="160" width="0" height="3" rx="1.5" fill="url(#accentCyan)">
      <animate attributeName="width" values="0;100" dur="1.5s" begin="0.7s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 3: Projects -->
  <g transform="translate(465, 15)">
    <rect width="210" height="170" rx="16" fill="url(#cardGradBase)" stroke="#3D2A5C" stroke-width="1.5" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#3D2A5C;#C026D3;#3D2A5C" dur="5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="5s" repeatCount="indefinite" begin="2s"/>
    </rect>

    <circle cx="105" cy="45" r="40" fill="url(#iconGlowMagenta)">
      <animate attributeName="r" values="40;48;40" dur="4s" repeatCount="indefinite" begin="2s"/>
    </circle>

    <g transform="translate(87, 27)">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="url(#accentMagenta)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </g>

    <text x="105" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#accentMagenta)" filter="url(#textShadow)">
      8
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.8s" fill="freeze"/>
    </text>

    <text x="105" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">
      Featured Projects
    </text>

    <rect x="30" y="160" width="150" height="3" rx="1.5" fill="#3D2A5C"/>
    <rect x="30" y="160" width="0" height="3" rx="1.5" fill="url(#accentMagenta)">
      <animate attributeName="width" values="0;120" dur="1.5s" begin="1s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 4: Stars -->
  <g transform="translate(690, 15)">
    <rect width="210" height="170" rx="16" fill="url(#cardGradBase)" stroke="#3D2A5C" stroke-width="1.5" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#3D2A5C;#14B8A6;#3D2A5C" dur="5s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="5s" repeatCount="indefinite" begin="3s"/>
    </rect>

    <circle cx="105" cy="45" r="40" fill="url(#iconGlowTeal)">
      <animate attributeName="r" values="40;48;40" dur="4s" repeatCount="indefinite" begin="3s"/>
    </circle>

    <g transform="translate(87, 27)">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="url(#accentTeal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
    </g>

    <text x="105" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#accentTeal)" filter="url(#textShadow)">
      12
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.1s" fill="freeze"/>
    </text>

    <text x="105" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">
      Stars Earned
    </text>

    <rect x="30" y="160" width="150" height="3" rx="1.5" fill="#3D2A5C"/>
    <rect x="30" y="160" width="0" height="3" rx="1.5" fill="url(#accentTeal)">
      <animate attributeName="width" values="0;90" dur="1.5s" begin="1.3s" fill="freeze"/>
    </rect>
  </g>

  <!-- Floating particles between cards -->
  <g fill="#A855F7" opacity="0.3">
    <circle cx="232" cy="60" r="2">
      <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="457" cy="80" r="1.5">
      <animate attributeName="cy" values="80;70;80" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="682" cy="55" r="2.5">
      <animate attributeName="cy" values="55;45;55" dur="2.8s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="232" cy="140" r="1.5">
      <animate attributeName="cy" values="140;130;140" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="457" cy="130" r="2">
      <animate attributeName="cy" values="130;120;130" dur="3.8s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="682" cy="145" r="1.5">
      <animate attributeName="cy" values="145;135;145" dur="3.2s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
  </g>

  <!-- Connecting circuit lines -->
  <g stroke="url(#accentViolet)" stroke-width="1" stroke-dasharray="6 4" opacity="0.15">
    <path d="M227 85 Q253 65 279 85">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M452 85 Q478 65 504 85">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M677 85 Q703 65 729 85">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="4s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>
</svg>