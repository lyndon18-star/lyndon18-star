<svg width="100%" height="110" viewBox="0 0 450 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGradBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24153B"/>
      <stop offset="100%" stop-color="#1A0F2E"/>
    </linearGradient>
    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="accentMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="cardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="iconGlowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Entrance fade + slight rise for the whole grid -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.05s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.9s" begin="0.05s" fill="freeze"/>

    <!-- Card 1: Repositories -->
    <g transform="translate(8, 8)">
      <rect width="207" height="94" rx="10" fill="url(#cardGradBase)" stroke="#3D2A5C" stroke-width="1.2" filter="url(#cardGlow)">
        <animate attributeName="stroke" values="#3D2A5C;#7C3AED;#3D2A5C" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1.2;2;1.2" dur="5s" repeatCount="indefinite"/>
      </rect>
    <circle cx="38" cy="28" r="18" fill="url(#iconGlowViolet)">
      <animate attributeName="r" values="18;22;18" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(26, 16)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#accentViolet)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
      </svg>
    </g>
    <text x="62" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#accentViolet)" filter="url(#textShadow)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.1s" fill="freeze"/>
      11
    </text>
    <text x="62" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#CBD5E1">Repos</text>
    <rect x="8" y="78" width="191" height="2" rx="1" fill="#3D2A5C"/>
    <rect x="8" y="78" width="0" height="2" rx="1" fill="url(#accentViolet)">
      <animate attributeName="width" values="0;150" dur="1.2s" begin="0.3s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 2: Commits -->
  <g transform="translate(235, 8)">
    <rect width="207" height="94" rx="10" fill="url(#cardGradBase)" stroke="#3D2A5C" stroke-width="1.2" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#3D2A5C;#06B6D4;#3D2A5C" dur="5s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="stroke-width" values="1.2;2;1.2" dur="5s" repeatCount="indefinite" begin="0.8s"/>
    </rect>
    <circle cx="38" cy="28" r="18" fill="url(#iconGlowCyan)">
      <animate attributeName="r" values="18;22;18" dur="4s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <g transform="translate(26, 16)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#accentCyan)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
    </g>
    <text x="62" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#accentCyan)" filter="url(#textShadow)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
      340
    </text>
    <text x="62" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#CBD5E1">Commits</text>
    <rect x="8" y="78" width="191" height="2" rx="1" fill="#3D2A5C"/>
    <rect x="8" y="78" width="0" height="2" rx="1" fill="url(#accentCyan)">
      <animate attributeName="width" values="0;130" dur="1.2s" begin="0.5s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 3: Projects -->
  <g transform="translate(8, 58)">
    <rect width="207" height="44" rx="10" fill="url(#cardGradBase)" stroke="#3D2A5C" stroke-width="1.2" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#3D2A5C;#C026D3;#3D2A5C" dur="5s" repeatCount="indefinite" begin="1.6s"/>
      <animate attributeName="stroke-width" values="1.2;2;1.2" dur="5s" repeatCount="indefinite" begin="1.6s"/>
    </rect>
    <circle cx="28" cy="22" r="14" fill="url(#iconGlowMagenta)">
      <animate attributeName="r" values="14;17;14" dur="4s" repeatCount="indefinite" begin="1.6s"/>
    </circle>
    <g transform="translate(20, 14)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="url(#accentMagenta)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </g>
    <text x="48" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="url(#accentMagenta)" filter="url(#textShadow)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze"/>
      8
    </text>
    <text x="48" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#CBD5E1">Projects</text>
  </g>

  <!-- Card 4: Stars -->
  <g transform="translate(235, 58)">
    <rect width="207" height="44" rx="10" fill="url(#cardGradBase)" stroke="#3D2A5C" stroke-width="1.2" filter="url(#cardGlow)">
      <animate attributeName="stroke" values="#3D2A5C;#14B8A6;#3D2A5C" dur="5s" repeatCount="indefinite" begin="2.4s"/>
      <animate attributeName="stroke-width" values="1.2;2;1.2" dur="5s" repeatCount="indefinite" begin="2.4s"/>
    </rect>
    <circle cx="28" cy="22" r="14" fill="url(#iconGlowTeal)">
      <animate attributeName="r" values="14;17;14" dur="4s" repeatCount="indefinite" begin="2.4s"/>
    </circle>
    <g transform="translate(20, 14)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="url(#accentTeal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
    </g>
    <text x="48" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="url(#accentTeal)" filter="url(#textShadow)">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze"/>
      12
    </text>
    <text x="48" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#CBD5E1">Stars</text>
  </g>
  </g>
</svg>