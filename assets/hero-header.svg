<svg width="100%" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Entrance fade + subtle lift for the whole hero */
      #heroRoot {
        opacity: 0;
        transform: translateY(8px);
        animation: heroIn 1.1s ease-out 0.05s forwards;
      }
      @keyframes heroIn {
        70% { opacity: 1; transform: translateY(-1px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      /* Stronger glow emphasis on the main ambient orbs */
      .heroGlowPulse {
        animation: heroGlowPulse 5s ease-in-out infinite;
      }
      @keyframes heroGlowPulse {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(168,85,247,0.25)) drop-shadow(0 0 24px rgba(168,85,247,0.10)); }
        50% { filter: drop-shadow(0 0 14px rgba(168,85,247,0.45)) drop-shadow(0 0 40px rgba(168,85,247,0.22)); }
      }
      /* Pulse the central ring system a bit harder */
      .heroRingPulse {
        animation: heroRingPulse 4.2s ease-in-out infinite;
      }
      @keyframes heroRingPulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.95; }
      }
    </style>

    <!-- Deep space background gradient -->
    <radialGradient id="heroBgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1A0F2E"/>
      <stop offset="50%" stop-color="#0F0A1A"/>
      <stop offset="100%" stop-color="#080510"/>
    </radialGradient>

    <!-- Primary violet gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <!-- Cyan-tech gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Magenta gradient -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Particle gradients -->
    <radialGradient id="particleViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="particleCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="particleMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <!-- Circuit line gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="80%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <!-- Ring gradient -->
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <g id="heroRoot">
  <!-- Background -->
  <rect width="1200" height="180" fill="url(#heroBgGrad)"/>

  <!-- Subtle radial vignette to make the center pop -->
  <rect width="1200" height="180" fill="url(#heroVignette)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#3D2A5C" stroke-width="0.5" opacity="0.3">
    <g>
      <line x1="0" y1="0" x2="1200" y2="0"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,40" dur="20s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="0" y1="0" x2="0" y2="280"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;40,0" dur="25s" repeatCount="indefinite"/>
    </g>
  </g>    <!-- Large ambient glow orbs (stronger emphasis, slightly faster drift) -->
  <g class="heroGlowPulse">
    <circle cx="200" cy="80" r="140" fill="url(#particleViolet)" opacity="0.12" filter="url(#glowStrong)">
      <animate attributeName="cx" values="200;250;200" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;55;80" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.22;0.10" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="140;165;140" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1000" cy="130" r="140" fill="url(#particleCyan)" opacity="0.10" filter="url(#glowStrong)">
      <animate attributeName="cx" values="1000;945;1000" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="130;155;130" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.20;0.08" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="140;165;140" dur="5.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="600" cy="-55" r="180" fill="url(#particleMagenta)" opacity="0.08" filter="url(#glowStrong)">
    <animate attributeName="cy" values="-55;-5;-55" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.16;0.06" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="180;210;180" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated circuit lines across top -->
  <g stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="12 8">
    <path d="M0 40 Q200 10 600 40 T1200 40">
      <animate attributeName="stroke-dashoffset" from="0" to="40" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0 240 Q200 270 600 240 T1200 240">
      <animate attributeName="stroke-dashoffset" from="0" to="40" dur="4s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>

  <!-- Floating geometric shapes -->
  <g opacity="0.4">
    <!-- Rotating squares -->
    <g transform="translate(150, 80)">
      <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="url(#violetGrad)" stroke-width="1.5" rx="4">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="url(#cyanGrad)" stroke-width="1" rx="2">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="15s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(1050, 60)">
      <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="url(#magentaGrad)" stroke-width="1.5" rx="4">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Floating triangles -->
    <g transform="translate(300, 200)">
      <polygon points="0,-15 13,7 -13,7" fill="none" stroke="url(#violetGrad)" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="200;180;200" dur="6s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <g transform="translate(900, 120)">
      <polygon points="0,-12 10,6 -10,6" fill="none" stroke="url(#cyanGrad)" stroke-width="1">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- Floating code brackets and symbols -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="22" font-weight="700" fill="url(#violetGrad)" opacity="0.12">
    <text x="80" y="160">
      <animate attributeName="opacity" values="0.12;0.25;0.12" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="160;152;160" dur="5s" repeatCount="indefinite"/>
    >{</text>
    <text x="220" y="160">
      <animate attributeName="opacity" values="0.12;0.25;0.12" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="y" values="160;152;160" dur="5s" repeatCount="indefinite" begin="1s"/>
    >}</text>
    <text x="400" y="160">
      <animate attributeName="opacity" values="0.08;0.2;0.08" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="y" values="160;154;160" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
    >[</text>
    <text x="540" y="160">
      <animate attributeName="opacity" values="0.08;0.2;0.08" dur="3.5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="y" values="160;154;160" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
    >]</text>
    <text x="720" y="160">
      <animate attributeName="opacity" values="0.12;0.25;0.12" dur="4s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="y" values="160;152;160" dur="5s" repeatCount="indefinite" begin="0.8s"/>
    >(</text>
    <text x="860" y="160">
      <animate attributeName="opacity" values="0.12;0.25;0.12" dur="4s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="y" values="160;152;160" dur="5s" repeatCount="indefinite" begin="1.8s"/>
    >)</text>
    <text x="1000" y="160">
      <animate attributeName="opacity" values="0.08;0.2;0.08" dur="3.5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="y" values="160;154;160" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    >=</text>
    <text x="1120" y="160">
      <animate attributeName="opacity" values="0.08;0.2;0.08" dur="3.5s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="y" values="160;154;160" dur="4.5s" repeatCount="indefinite" begin="2.5s"/>
    >></text>
  </g>

  <!-- Central identity area (replaces profile picture) -->
  <g transform="translate(600, 90)">
    <!-- Outer pulsing rings (stronger emphasis, tighter timing) -->
    <g class="heroRingPulse">
      <circle cx="0" cy="0" r="70" fill="none" stroke="url(#violetGrad)" stroke-width="1.8" opacity="0.45">
        <animate attributeName="r" values="70;98;70" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="55" fill="none" stroke="url(#cyanGrad)" stroke-width="1.2" opacity="0.32">
        <animate attributeName="r" values="55;80;55" dur="5.2s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="opacity" values="0.32;0.08;0.32" dur="5.2s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="0" cy="0" r="40" fill="none" stroke="url(#magentaGrad)" stroke-width="1.2" opacity="0.28">
        <animate attributeName="r" values="40;65;40" dur="6.2s" repeatCount="indefinite" begin="1.2s"/>
        <animate attributeName="opacity" values="0.28;0.08;0.28" dur="6.2s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
    </g>

    <!-- Central hexagon badge -->
    <g>
      <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20"
               fill="url(#violetGrad)" stroke="url(#cyanGrad)" stroke-width="1.8" opacity="0.9" filter="url(#glowSoft)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </polygon>

      <!-- Inner hexagon -->
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14"
               fill="url(#heroBgGrad)" stroke="url(#violetGrad)" stroke-width="1.3" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="25s" repeatCount="indefinite"/>
      </polygon>

      <!-- Core symbol: code brackets -->
      <g transform="translate(0, 5)">
        <text x="0" y="9" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="url(#textGrad)" filter="url(#textGlow)">
          <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
        &lt;/&gt;</text>
      </g>
    </g>

    <!-- Orbiting particles around center -->
    <g>
      <circle cx="0" cy="0" r="50" fill="none" stroke="none">
        <!-- Orbit 1 -->
        <circle cx="50" cy="0" r="4" fill="url(#violetGrad)" filter="url(#glowSoft)">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="7s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <!-- Orbit 2 -->
        <circle cx="-50" cy="0" r="3" fill="url(#cyanGrad)" filter="url(#glowSoft)">
          <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="9s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <!-- Orbit 3 -->
        <circle cx="0" cy="-50" r="3" fill="url(#magentaGrad)" filter="url(#glowSoft)">
          <animateTransform attributeName="transform" type="rotate" from="90 0 0" to="450 0 0" dur="11s" repeatCount="indefinite" begin="1s"/>
          <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <!-- Orbit 4 -->
        <circle cx="0" cy="50" r="2.5" fill="url(#violetGrad)" filter="url(#glowSoft)" opacity="0.7">
          <animateTransform attributeName="transform" type="rotate" from="270 0 0" to="630 0 0" dur="8s" repeatCount="indefinite" begin="0.5s"/>
          <animate attributeName="r" values="2.5;4;2.5" dur="2s" repeatCount="indefinite"/>
        </circle>
      </circle>
    </g>
  </g>

  <!-- Bottom accent wave (stronger pulse) -->
  <path d="M0 180 Q200 140 400 160 T800 150 T1200 180" fill="url(#violetGrad)" opacity="0.18">
    <animate attributeName="opacity" values="0.18;0.32;0.18" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Entrance-only chips that fade out after the hero reveals -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3.2s" begin="0.1s" fill="freeze"/>
    <text x="60" y="120" font-family="monospace" font-size="28" font-weight="700" fill="#A855F7" opacity="0.35">
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite" begin="0.4s"/>
    >&lt;/&gt;
    </text>
    <text x="1080" y="130" font-family="monospace" font-size="30" font-weight="700" fill="#22D3EE" opacity="0.25">
      <animate attributeName="opacity" values="0.18;0.4;0.18" dur="3.6s" repeatCount="indefinite" begin="0.8s"/>
    >/*
    </text>
  </g>
  </g>
</svg>