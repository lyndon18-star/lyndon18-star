<svg width="100%" height="40" viewBox="0 0 1000 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <line x1="0" y1="20" x2="1000" y2="20" stroke="url(#dividerGrad)" stroke-width="1.5"/>
  <circle cx="500" cy="20" r="6" fill="url(#dotGrad)">
    <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>