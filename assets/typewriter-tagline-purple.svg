<svg width="100%" height="32" viewBox="0 0 600 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="taglineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background underline accent -->
  <rect x="0" y="24" width="600" height="2" fill="url(#taglineGrad)" opacity="0.3">
    <animate attributeName="width" values="0;600;600" dur="0.5s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline text with typewriter reveal via opacity per-character groups -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="url(#taglineGrad)" filter="url(#textGlow)">
    <!-- Each character fades in sequence to simulate typing -->
    <text x="8" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="0.3s" fill="freeze"/>
      D
    </text>
    <text x="16" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="0.45s" fill="freeze"/>
      e
    </text>
    <text x="22" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="0.6s" fill="freeze"/>
      s
    </text>
    <text x="28" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="0.75s" fill="freeze"/>
      i
    </text>
    <text x="33" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="0.9s" fill="freeze"/>
      g
    </text>
    <text x="39" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.05s" fill="freeze"/>
      n
    </text>
    <text x="46" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.2s" fill="freeze"/>
      e
    </text>
    <text x="53" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.35s" fill="freeze"/>
      r
    </text>
    <text x="60" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.5s" fill="freeze"/>
      -
    </text>
    <text x="66" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.65s" fill="freeze"/>
      f
    </text>
    <text x="72" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.8s" fill="freeze"/>
      u
    </text>
    <text x="78" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.95s" fill="freeze"/>
      l
    </text>
    <text x="83" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.1s" fill="freeze"/>
      l
    </text>
    <text x="89" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.25s" fill="freeze"/>
      s
    </text>
    <text x="95" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.4s" fill="freeze"/>
      t
    </text>
    <text x="101" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.55s" fill="freeze"/>
      r
    </text>
    <text x="108" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.7s" fill="freeze"/>
      e
    </text>
    <text x="115" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="2.85s" fill="freeze"/>
      a
    </text>
    <text x="121" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.0s" fill="freeze"/>
      m
    </text>
    <text x="128" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.15s" fill="freeze"/>
      ;
    </text>
    <text x="134" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.3s" fill="freeze"/>
      "
    </text>
    <text x="140" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.45s" fill="freeze"/>
      B
    </text>
    <text x="149" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.6s" fill="freeze"/>
      u
    </text>
    <text x="155" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.75s" fill="freeze"/>
      i
    </text>
    <text x="160" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.9s" fill="freeze"/>
      l
    </text>
    <text x="166" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="4.05s" fill="freeze"/>
      d
    </text>
    <text x="173" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="4.2s" fill="freeze"/>
      i
    </text>
    <text x="178" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="4.35s" fill="freeze"/>
      n
    </text>
    <text x="185" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="4.5s" fill="freeze"/>
      g
    </text>
    <text x="191" y="20">
      <animate attributeName="opacity" values="0;1" dur="0.15s" begin="4.65s" fill="freeze"/>
      "
    </text>

    <!-- Blinking cursor after text -->
    <rect x="200" y="6" width="8" height="18" rx="1" fill="url(#taglineGrad)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
