<svg width="700" height="220" viewBox="0 0 700 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codeBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F0A1A"/>
      <stop offset="100%" stop-color="#1A0F2E"/>
    </linearGradient>

    <linearGradient id="titleBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0F2E"/>
      <stop offset="100%" stop-color="#24153B"/>
    </linearGradient>

    <linearGradient id="violetTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="cyanTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="magentaTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cursorGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal background -->
  <rect width="700" height="220" rx="16" fill="url(#codeBgGrad)" stroke="#3D2A5C" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="700" height="44" rx="16 16 0 0" fill="url(#titleBarGrad)" stroke="#3D2A5C" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="18" cy="22" r="7" fill="#FF5F57"/>
  <circle cx="40" cy="22" r="7" fill="#FEBC2E"/>
  <circle cx="62" cy="22" r="7" fill="#28CA42"/>

  <!-- Tab -->
  <rect x="100" y="8" width="140" height="28" rx="6" fill="#0F0A1A" stroke="#3D2A5C" stroke-width="0.5"/>
  <text x="110" y="28" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#94A3B8">hero.tsx</text>

  <!-- Minimap indicator -->
  <g transform="translate(620, 8)" opacity="0.4">
    <rect width="60" height="28" rx="2" fill="#0F0A1A" stroke="#3D2A5C" stroke-width="0.5"/>
    <rect x="4" y="4" width="52" height="2" rx="1" fill="#7C3AED" opacity="0.6"/>
    <rect x="4" y="10" width="38" height="1.5" rx="0.75" fill="#A855F7" opacity="0.4"/>
    <rect x="4" y="15" width="45" height="1.5" rx="0.75" fill="#7C3AED" opacity="0.5"/>
    <rect x="4" y="20" width="30" height="1.5" rx="0.75" fill="#A855F7" opacity="0.3"/>
  </g>

  <!-- Code lines with typing animation -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" line-height="1.6" fill="#E2E8F0">

    <!-- Line 1 -->
    <text x="24" y="70" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze" />
    ><tspan fill="#FF7B72">import</tspan> <tspan fill="#D2A8FF">{</tspan> <tspan fill="#FFA657">useState</tspan><tspan fill="#D2A8FF">,</tspan> <tspan fill="#FFA657">useEffect</tspan> <tspan fill="#D2A8FF">}</tspan> <tspan fill="#FF7B72">from</tspan> <tspan fill="#A5D6FF">"react"</tspan><tspan fill="#D2A8FF">;</tspan></text>

    <!-- Line 2 -->
    <text x="24" y="96" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1s" fill="freeze" />
    ><tspan fill="#FF7B72">import</tspan> <tspan fill="#D2A8FF">{</tspan> <tspan fill="#FFA657">motion</tspan><tspan fill="#D2A8FF">,</tspan> <tspan fill="#FFA657">AnimatePresence</tspan> <tspan fill="#D2A8FF">}</tspan> <tspan fill="#FF7B72">from</tspan> <tspan fill="#A5D6FF">"framer-motion"</tspan><tspan fill="#D2A8FF">;</tspan></text>

    <!-- Line 3 -->
    <text x="24" y="122" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze" />
    ><tspan fill="#FF7B72">import</tspan> <tspan fill="#D2A8FF">{</tspan> <tspan fill="#FFA657">CodeCat</tspan><tspan fill="#D2A8FF">,</tspan> <tspan fill="#FFA657">ParticleField</tspan> <tspan fill="#D2A8FF">}</tspan> <tspan fill="#FF7B72">from</tspan> <tspan fill="#A5D6FF">"@/components/ui"</tspan><tspan fill="#D2A8FF">;</tspan></text>

    <!-- Line 4 - blank -->
    <text x="24" y="148" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze" />
    ></text>

    <!-- Line 5 -->
    <text x="24" y="174" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.6s" fill="freeze" />
    ><tspan fill="#D2A8FF">export</tspan> <tspan fill="#FF7B72">default</tspan> <tspan fill="#D2A8FF">function</tspan> <tspan fill="#79C0FF">Hero</tspan><tspan fill="#D2A8FF">()</tspan> <tspan fill="#D2A8FF">{</tspan></text>

    <!-- Line 6 -->
    <text x="48" y="200" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.2s" fill="freeze" />
    ><tspan fill="#9CDCFE">const</tspan> <tspan fill="#D4D4D4">[</tspan><tspan fill="#4EC9B0">name</tspan><tspan fill="#D4D4D4">,</tspan> <tspan fill="#D4D4D4">setName</tspan><tspan fill="#D4D4D4">]</tspan> <tspan fill="#D4D4D4">=</tspan> <tspan fill="#DCDCAA">useState</tspan><tspan fill="#D2A8FF">(</tspan><tspan fill="#CE9178">"Lyndon"</tspan><tspan fill="#D2A8FF">)</tspan><tspan fill="#D2A8FF">;</tspan></text>

    <!-- Line 7 -->
    <text x="48" y="226" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.8s" fill="freeze" />
    ><tspan fill="#9CDCFE">const</tspan> <tspan fill="#D4D4D4">[</tspan><tspan fill="#4EC9B0">stack</tspan><tspan fill="#D4D4D4">]</tspan> <tspan fill="#D4D4D4">=</tspan> <tspan fill="#D4D4D4">[</tspan><tspan fill="#CE9178">"Next.js"</tspan><tspan fill="#D4D4D4">,</tspan> <tspan fill="#CE9178">"TypeScript"</tspan><tspan fill="#D4D4D4">,</tspan> <tspan fill="#CE9178">"Tailwind"</tspan><tspan fill="#D4D4D4">]</tspan><tspan fill="#D2A8FF">;</tspan></text>

    <!-- Line 8 -->
    <text x="48" y="252" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.4s" fill="freeze" />
    ><tspan fill="#9CDCFE">const</tspan> <tspan fill="#D4D4D4">[</tspan><tspan fill="#4EC9B0">theme</tspan><tspan fill="#D4D4D4">]</tspan> <tspan fill="#D4D4D4">=</tspan> <tspan fill="#D4D4D4">[</tspan><tspan fill="#CE9178">"purple"</tspan><tspan fill="#D4D4D4">,</tspan> <tspan fill="#CE9178">"violet"</tspan><tspan fill="#D4D4D4">,</tspan> <tspan fill="#CE9178">"magenta"</tspan><tspan fill="#D4D4D4">]</tspan><tspan fill="#D2A8FF">;</tspan></text>

    <!-- Line 9 -->
    <text x="24" y="278" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="5s" fill="freeze" />
    ><tspan fill="#D2A8FF">return</tspan> <tspan fill="#D2A8FF">(</tspan></text>

    <!-- Line 10 -->
    <text x="48" y="304" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="5.4s" fill="freeze" />
    ><tspan fill="#FF7B72"><</tspan><tspan fill="#FFA657">motion.div</tspan> <tspan fill="#9CDCFE">initial</tspan><tspan fill="#D2A8FF">=</tspan><tspan fill="#D2A8FF">{{</tspan><tspan fill="#D4D4D4">opacity:</tspan> <tspan fill="#B5CEA8">0</tspan><tspan fill="#D2A8FF">}}</tspan> <tspan fill="#9CDCFE">animate</tspan><tspan fill="#D2A8FF">=</tspan><tspan fill="#D2A8FF">{{</tspan><tspan fill="#D4D4D4">opacity:</tspan> <tspan fill="#B5CEA8">1</tspan><tspan fill="#D2A8FF">}}</tspan> <tspan fill="#9CDCFE">transition</tspan><tspan fill="#D2A8FF">=</tspan><tspan fill="#D2A8FF">{{</tspan><tspan fill="#D4D4D4">duration:</tspan> <tspan fill="#B5CEA8">0.8</tspan><tspan fill="#D2A8FF">}}</tspan><tspan fill="#FF7B72">></tspan></text>

    <!-- Line 11 -->
    <text x="72" y="330" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="5.8s" fill="freeze" />
    ><tspan fill="#FF7B72"><</tspan><tspan fill="#FFA657">CodeCat</tspan> <tspan fill="#9CDCFE">className</tspan><tspan fill="#D2A8FF">=</tspan><tspan fill="#D2A8FF">"</tspan><tspan fill="#CE9178">hero-mascot</tspan><tspan fill="#D2A8FF">"</tspan> <tspan fill="#FF7B72">/></tspan></text>

    <!-- Line 12 -->
    <text x="72" y="356" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="6.2s" fill="freeze" />
    ><tspan fill="#FF7B72"><</tspan><tspan fill="#FFA657">h1</tspan> <tspan fill="#9CDCFE">className</tspan><tspan fill="#D2A8FF">=</tspan><tspan fill="#D2A8FF">"</tspan><tspan fill="#CE9178">gradient-text</tspan><tspan fill="#D2A8FF">"</tspan><tspan fill="#FF7B72">></tspan></text>

    <!-- Line 13 - Animated text -->
    <text x="96" y="382" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="6.6s" fill="freeze" />
    >Building <tspan fill="url(#violetTextGrad)" font-weight="700" filter="url(#textGlow)">Useful Software</tspan><tspan fill="#D4D4D4">...</tspan></text>

    <!-- Line 14 -->
    <text x="72" y="408" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="7s" fill="freeze" />
    ><tspan fill="#FF7B72"></</tspan><tspan fill="#FFA657">h1</tspan><tspan fill="#FF7B72">></tspan></text>

    <!-- Line 15 -->
    <text x="48" y="434" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="7.4s" fill="freeze" />
    ><tspan fill="#FF7B72"><</tspan><tspan fill="#FFA657">ParticleField</tspan> <tspan fill="#9CDCFE">count</tspan><tspan fill="#D2A8FF">=</tspan><tspan fill="#D2A8FF">{{</tspan><tspan fill="#B5CEA8">50</tspan><tspan fill="#D2A8FF">}}</tspan> <tspan fill="#9CDCFE">colors</tspan><tspan fill="#D2A8FF">=</tspan><tspan fill="#D2A8FF">{{</tspan><tspan fill="#B5CEA8">theme</tspan><tspan fill="#D2A8FF">}}</tspan> <tspan fill="#FF7B72">/></tspan></text>

    <!-- Line 16 -->
    <text x="24" y="460" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="7.8s" fill="freeze" />
    ><tspan fill="#FF7B72"></</tspan><tspan fill="#FFA657">motion.div</tspan><tspan fill="#FF7B72">></tspan></text>

    <!-- Line 17 -->
    <text x="24" y="486" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="8.2s" fill="freeze" />
    ><tspan fill="#D2A8FF">}</tspan><tspan fill="#D2A8FF">;</tspan></text>

  </g>

  <!-- Blinking cursor -->
  <rect x="180" y="468" width="10" height="18" rx="2" fill="url(#violetTextGrad)" filter="url(#cursorGlow)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="8.6s" repeatCount="indefinite" />
  </rect>

  <!-- Floating particles around code -->
  <g fill="url(#violetTextGrad)" opacity="0.25">
    <circle cx="650" cy="60" r="2.5">
      <animate attributeName="cy" values="60;52;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="650;656;650" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="140" r="2">
      <animate attributeName="cy" values="140;130;140" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cx" values="670;664;670" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="620" cy="100" r="3">
      <animate attributeName="cy" values="100;90;100" dur="2.8s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="680" cy="30" r="1.5">
      <animate attributeName="cy" values="30;24;30" dur="4s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
  </g>

  <g fill="url(#cyanTextGrad)" opacity="0.2">
    <circle cx="580" cy="180" r="2">
      <animate attributeName="cy" values="180;172;180" dur="3.2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="600" cy="40" r="1.5">
      <animate attributeName="cy" values="40;34;40" dur="3.8s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
  </g>

  <g fill="url(#magentaTextGrad)" opacity="0.2">
    <circle cx="640" cy="200" r="2.5">
      <animate attributeName="cy" values="200;192;200" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="660" cy="80" r="1.5">
      <animate attributeName="cy" values="80;72;80" dur="3.5s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
