<svg width="100%" height="60" viewBox="0 0 1000 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 30 Q150 5 250 30 T500 30 T750 30 T1000 30" stroke="url(#waveGrad)" stroke-width="2.5" fill="none" stroke-dasharray="10 5" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="30" dur="3s" repeatCount="indefinite" />
  </path>
  <!-- Center accent -->
  <circle cx="500" cy="30" r="8" fill="#38BDF8" opacity="0.8">
    <animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>