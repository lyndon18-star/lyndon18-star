<svg width="100%" height="140" viewBox="0 0 1200 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="75%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C026D3" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#C026D3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad4" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wave 1: Primary Violet (deepest) -->
  <path d="M0 85 Q150 25 300 85 T600 85 T900 85 T1200 85"
        stroke="url(#waveGrad1)" stroke-width="3" fill="none"
        stroke-dasharray="20 12" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="64" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Wave 2: Cyan (upper) -->
  <path d="M0 105 Q150 60 300 105 T600 105 T900 105 T1200 105"
        stroke="url(#waveGrad2)" stroke-width="2" fill="none"
        stroke-dasharray="15 15" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Wave 3: Magenta (lower) -->
  <path d="M0 65 Q150 100 300 65 T600 65 T900 65 T1200 65"
        stroke="url(#waveGrad3)" stroke-width="2" fill="none"
        stroke-dasharray="15 15" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="7s" repeatCount="indefinite" />
  </path>

  <!-- Wave 4: Teal (subtle upper) -->
  <path d="M0 120 Q150 80 300 120 T600 120 T900 120 T1200 120"
        stroke="url(#waveGrad4)" stroke-width="1.5" fill="none"
        stroke-dasharray="10 20" stroke-linecap="round" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Animated nodes on wave 1 -->
  <g fill="url(#nodeGlow)">
    <circle cx="80" cy="85" r="7">
      <animate attributeName="r" values="7;12;7" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="85" r="7">
      <animate attributeName="r" values="7;12;7" dur="2.5s" repeatCount="indefinite" begin="0.4s" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="0.4s" />
    </circle>
    <circle cx="440" cy="85" r="7">
      <animate attributeName="r" values="7;12;7" dur="2.5s" repeatCount="indefinite" begin="0.8s" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="0.8s" />
    </circle>
    <circle cx="620" cy="85" r="7">
      <animate attributeName="r" values="7;12;7" dur="2.5s" repeatCount="indefinite" begin="1.2s" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="1.2s" />
    </circle>
    <circle cx="800" cy="85" r="7">
      <animate attributeName="r" values="7;12;7" dur="2.5s" repeatCount="indefinite" begin="1.6s" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="1.6s" />
    </circle>
    <circle cx="980" cy="85" r="7">
      <animate attributeName="r" values="7;12;7" dur="2.5s" repeatCount="indefinite" begin="2s" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="2s" />
    </circle>
    <circle cx="1160" cy="85" r="7">
      <animate attributeName="r" values="7;12;7" dur="2.5s" repeatCount="indefinite" begin="2.4s" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="2.4s" />
    </circle>
  </g>

  <!-- Tech labels floating along waves -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#D8B4FE" opacity="0.7">
    <text x="60" y="30">
      <animate attributeName="y" values="30;24;30" dur="3s" repeatCount="indefinite" />
    >React</text>
    <text x="200" y="115">
      <animate attributeName="y" values="115;108;115" dur="3.5s" repeatCount="indefinite" begin="0.3s" />
    >TypeScript</text>
    <text x="340" y="25">
      <animate attributeName="y" values="25;19;25" dur="4s" repeatCount="indefinite" begin="0.6s" />
    >Next.js</text>
    <text x="480" y="125">
      <animate attributeName="y" values="125;118;125" dur="3.8s" repeatCount="indefinite" begin="0.9s" />
    >Tailwind</text>
    <text x="620" y="30">
      <animate attributeName="y" values="30;24;30" dur="3.2s" repeatCount="indefinite" begin="1.2s" />
    >Node.js</text>
    <text x="760" y="110">
      <animate attributeName="y" values="110;103;110" dur="4.2s" repeatCount="indefinite" begin="1.5s" />
    >PostgreSQL</text>
    <text x="900" y="25">
      <animate attributeName="y" values="25;19;25" dur="3.5s" repeatCount="indefinite" begin="1.8s" />
    >Docker</text>
    <text x="1040" y="115">
      <animate attributeName="y" values="115;108;115" dur="3.8s" repeatCount="indefinite" begin="2.1s" />
    >AWS</text>
  </g>

  <!-- Small circuit nodes on wave 2 -->
  <g fill="url(#nodeGlowCyan)" opacity="0.5">
    <circle cx="130" cy="105" r="4">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="310" cy="105" r="4">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="490" cy="105" r="4">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" begin="1s" />
    </circle>
    <circle cx="670" cy="105" r="4">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" begin="1.5s" />
    </circle>
    <circle cx="850" cy="105" r="4">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" begin="2s" />
    </circle>
    <circle cx="1030" cy="105" r="4">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" begin="2.5s" />
    </circle>
  </g>

  <!-- Small circuit nodes on wave 3 -->
  <g fill="url(#nodeGlowMagenta)" opacity="0.5">
    <circle cx="40" cy="65" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="220" cy="65" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.2s" repeatCount="indefinite" begin="0.4s" />
    </circle>
    <circle cx="400" cy="65" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.2s" repeatCount="indefinite" begin="0.8s" />
    </circle>
    <circle cx="580" cy="65" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.2s" repeatCount="indefinite" begin="1.2s" />
    </circle>
    <circle cx="760" cy="65" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.2s" repeatCount="indefinite" begin="1.6s" />
    </circle>
    <circle cx="940" cy="65" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.2s" repeatCount="indefinite" begin="2s" />
    </circle>
    <circle cx="1120" cy="65" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.2s" repeatCount="indefinite" begin="2.4s" />
    </circle>
  </g>

  <!-- Floating geometric shapes between waves -->
  <g opacity="0.3">
    <g transform="translate(180, 40)">
      <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="url(#waveGrad1)" stroke-width="1" rx="3">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(500, 20)">
      <polygon points="0,-10 8.6,5 -8.6,5" fill="none" stroke="url(#waveGrad2)" stroke-width="1">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3.5s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <g transform="translate(820, 50)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="url(#waveGrad3)" stroke-width="1">
        <animate attributeName="r" values="8;14;8" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(340, 115)">
      <rect x="-6" y="-6" width="12" height="12" fill="none" stroke="url(#waveGrad4)" stroke-width="1" rx="2">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Subtle vertical connection lines -->
  <g stroke="#7C3AED" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.15">
    <line x1="200" y1="65" x2="200" y2="105">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="65" x2="500" y2="105">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="800" y1="65" x2="800" y2="105">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite" begin="2s"/>
    </line>
    <line x1="1100" y1="65" x2="1100" y2="105">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </line>
  </g>
</svg>