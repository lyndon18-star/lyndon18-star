<svg width="100%" height="80" viewBox="0 0 1200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="75%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C026D3" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#C026D3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad4" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wave 1: Primary Violet (deepest) -->
  <path d="M0 45 Q150 15 300 45 T600 45 T900 45 T1200 45"
        stroke="url(#waveGrad1)" stroke-width="2.5" fill="none"
        stroke-dasharray="14 10" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="64" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Wave 2: Cyan (upper) -->
  <path d="M0 60 Q150 30 300 60 T600 60 T900 60 T1200 60"
        stroke="url(#waveGrad2)" stroke-width="1.5" fill="none"
        stroke-dasharray="12 12" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Wave 3: Magenta (lower) -->
  <path d="M0 35 Q150 60 300 35 T600 35 T900 35 T1200 35"
        stroke="url(#waveGrad3)" stroke-width="1.5" fill="none"
        stroke-dasharray="12 12" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="7s" repeatCount="indefinite" />
  </path>

  <!-- Wave 4: Teal (subtle upper) -->
  <path d="M0 70 Q150 50 300 70 T600 70 T900 70 T1200 70"
        stroke="url(#waveGrad4)" stroke-width="1" fill="none"
        stroke-dasharray="8 16" stroke-linecap="round" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Entrance reveal for the wave section -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.05s" fill="freeze"/>

    <!-- Animated nodes on wave 1 (stronger pulse contrast) -->
    <g fill="url(#nodeGlow)">
      <circle cx="80" cy="45" r="5">
        <animate attributeName="r" values="4;11;4" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="260" cy="45" r="5">
        <animate attributeName="r" values="4;11;4" dur="2.4s" repeatCount="indefinite" begin="0.4s" />
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite" begin="0.4s" />
      </circle>
      <circle cx="440" cy="45" r="5">
        <animate attributeName="r" values="4;11;4" dur="2.4s" repeatCount="indefinite" begin="0.8s" />
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite" begin="0.8s" />
      </circle>
      <circle cx="620" cy="45" r="5">
        <animate attributeName="r" values="4;11;4" dur="2.4s" repeatCount="indefinite" begin="1.2s" />
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite" begin="1.2s" />
      </circle>
      <circle cx="800" cy="45" r="5">
        <animate attributeName="r" values="4;11;4" dur="2.4s" repeatCount="indefinite" begin="1.6s" />
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite" begin="1.6s" />
      </circle>
      <circle cx="980" cy="45" r="5">
        <animate attributeName="r" values="4;11;4" dur="2.4s" repeatCount="indefinite" begin="2s" />
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite" begin="2s" />
      </circle>
      <circle cx="1160" cy="45" r="5">
        <animate attributeName="r" values="4;11;4" dur="2.4s" repeatCount="indefinite" begin="2.4s" />
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite" begin="2.4s" />
      </circle>
    </g>

    <!-- Tech labels floating along waves -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#D8B4FE" opacity="0.6">
      <text x="60" y="16">
        <animate attributeName="y" values="16;12;16" dur="3s" repeatCount="indefinite" />
      >React</text>
      <text x="200" y="68">
        <animate attributeName="y" values="68;64;68" dur="3.5s" repeatCount="indefinite" begin="0.3s" />
      >TypeScript</text>
      <text x="340" y="12">
        <animate attributeName="y" values="12;8;12" dur="4s" repeatCount="indefinite" begin="0.6s" />
      >Next.js</text>
      <text x="480" y="72">
        <animate attributeName="y" values="72;68;72" dur="3.8s" repeatCount="indefinite" begin="0.9s" />
      >Tailwind</text>
      <text x="620" y="16">
        <animate attributeName="y" values="16;12;16" dur="3.2s" repeatCount="indefinite" begin="1.2s" />
      >Node.js</text>
      <text x="760" y="65">
        <animate attributeName="y" values="65;61;65" dur="4.2s" repeatCount="indefinite" begin="1.5s" />
      >PostgreSQL</text>
      <text x="900" y="12">
        <animate attributeName="y" values="12;8;12" dur="3.5s" repeatCount="indefinite" begin="1.8s" />
      >Docker</text>
      <text x="1040" y="68">
        <animate attributeName="y" values="68;64;68" dur="3.8s" repeatCount="indefinite" begin="2.1s" />
      >AWS</text>
    </g>

    <!-- Small circuit nodes on wave 2 -->
    <g fill="url(#nodeGlowCyan)" opacity="0.4">
      <circle cx="130" cy="60" r="3">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="310" cy="60" r="3">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" begin="0.5s" />
      </circle>
      <circle cx="490" cy="60" r="3">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" begin="1s" />
      </circle>
      <circle cx="670" cy="60" r="3">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" begin="1.5s" />
      </circle>
      <circle cx="850" cy="60" r="3">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" begin="2s" />
      </circle>
      <circle cx="1030" cy="60" r="3">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" begin="2.5s" />
      </circle>
    </g>

    <!-- Small circuit nodes on wave 3 -->
    <g fill="url(#nodeGlowMagenta)" opacity="0.4">
      <circle cx="40" cy="35" r="3">
        <animate attributeName="r" values="3;4.5;3" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="220" cy="35" r="3">
        <animate attributeName="r" values="3;4.5;3" dur="3.2s" repeatCount="indefinite" begin="0.4s" />
      </circle>
      <circle cx="400" cy="35" r="3">
        <animate attributeName="r" values="3;4.5;3" dur="3.2s" repeatCount="indefinite" begin="0.8s" />
      </circle>
      <circle cx="580" cy="35" r="3">
        <animate attributeName="r" values="3;4.5;3" dur="3.2s" repeatCount="indefinite" begin="1.2s" />
      </circle>
      <circle cx="760" cy="35" r="3">
        <animate attributeName="r" values="3;4.5;3" dur="3.2s" repeatCount="indefinite" begin="1.6s" />
      </circle>
      <circle cx="940" cy="35" r="3">
        <animate attributeName="r" values="3;4.5;3" dur="3.2s" repeatCount="indefinite" begin="2s" />
      </circle>
      <circle cx="1120" cy="35" r="3">
        <animate attributeName="r" values="3;4.5;3" dur="3.2s" repeatCount="indefinite" begin="2.4s" />
      </circle>
    </g>

    <!-- Floating geometric shapes between waves -->
    <g opacity="0.25">
      <g transform="translate(180, 22)">
        <rect x="-6" y="-6" width="12" height="12" fill="none" stroke="url(#waveGrad1)" stroke-width="0.8" rx="2">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="15s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g transform="translate(500, 10)">
        <polygon points="0,-7 6,4 -6,4" fill="none" stroke="url(#waveGrad2)" stroke-width="0.8">
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="12s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3.5s" repeatCount="indefinite"/>
        </polygon>
      </g>

      <g transform="translate(820, 28)">
        <circle cx="0" cy="0" r="6" fill="none" stroke="url(#waveGrad3)" stroke-width="0.8">
          <animate attributeName="r" values="6;11;6" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g transform="translate(340, 62)">
        <rect x="-5" y="-5" width="10" height="10" fill="none" stroke="url(#waveGrad4)" stroke-width="0.8" rx="2">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="10s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- Subtle vertical connection lines -->
  <g stroke="#7C3AED" stroke-width="0.4" stroke-dasharray="3 6" opacity="0.12">
    <line x1="200" y1="35" x2="200" y2="60">
      <animate attributeName="stroke-dashoffset" from="0" to="18" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="35" x2="500" y2="60">
      <animate attributeName="stroke-dashoffset" from="0" to="18" dur="3s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="800" y1="35" x2="800" y2="60">
      <animate attributeName="stroke-dashoffset" from="0" to="18" dur="3s" repeatCount="indefinite" begin="2s"/>
    </line>
    <line x1="1100" y1="35" x2="1100" y2="60">
      <animate attributeName="stroke-dashoffset" from="0" to="18" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </line>
  </g>
</svg>